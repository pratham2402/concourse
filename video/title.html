<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Concourse</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap");

      :root {
        --bg: #0b1218;
        --text: #f2f0e9;
        --muted: #9fb0bd;
        --amber: #f2a65a;
        --green: #5ec28a;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
      }

      body {
        font-family: "Public Sans", system-ui, sans-serif;
        color: var(--text);
        display: grid;
        place-items: center;
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(22, 33, 43, 0.55) 1px, transparent 1px),
          linear-gradient(90deg, rgba(22, 33, 43, 0.55) 1px, transparent 1px);
        background-size: 30px 30px;
        mask-image: radial-gradient(circle at 50% 42%, black 0%, transparent 72%);
        opacity: 0.8;
      }

      .glow {
        position: absolute;
        width: 920px;
        height: 920px;
        left: 50%;
        top: 42%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(94, 194, 138, 0.12), transparent 62%);
        pointer-events: none;
      }

      .field {
        position: absolute;
        width: 760px;
        height: 760px;
        left: 50%;
        top: 44%;
        transform: translate(-50%, -50%) rotate(45deg);
        border: 1px solid rgba(44, 94, 71, 0.35);
        border-radius: 120px;
        pointer-events: none;
      }

      .field::before {
        content: "";
        position: absolute;
        inset: 72px;
        border: 1px solid rgba(44, 94, 71, 0.22);
        border-radius: 90px;
      }

      .content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 0 40px;
      }

      .mark {
        width: 68px;
        height: 68px;
        opacity: 0;
        transform: scale(0.86);
        animation: reveal 0.9s cubic-bezier(.2,.8,.2,1) 0.15s forwards;
        animation-play-state: paused;
      }

      .wordmark {
        margin-top: 22px;
        font-family: "Archivo", sans-serif;
        font-weight: 800;
        font-size: 78px;
        letter-spacing: -0.03em;
        line-height: 0.95;
        opacity: 0;
        transform: translateY(14px);
        animation: rise 0.9s cubic-bezier(.2,.8,.2,1) 0.35s forwards;
        animation-play-state: paused;
      }

      .tagline {
        margin-top: 16px;
        font-family: "Archivo", sans-serif;
        font-weight: 700;
        font-size: 44px;
        letter-spacing: -0.025em;
        color: var(--text);
        opacity: 0;
        transform: translateY(12px);
        animation: rise 0.9s cubic-bezier(.2,.8,.2,1) 0.65s forwards;
        animation-play-state: paused;
      }

      .tagline em {
        font-style: normal;
        color: var(--amber);
      }

      .subline {
        margin-top: 18px;
        max-width: 760px;
        font-size: 20px;
        line-height: 1.5;
        color: var(--muted);
        opacity: 0;
        transform: translateY(10px);
        animation: rise 0.9s cubic-bezier(.2,.8,.2,1) 0.95s forwards;
        animation-play-state: paused;
      }

      .foot {
        margin-top: 34px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.08em;
        color: rgba(159, 176, 189, 0.85);
        text-transform: uppercase;
        opacity: 0;
        animation: fade 0.9s ease 1.35s forwards;
        animation-play-state: paused;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 12px rgba(94, 194, 138, 0.65);
      }

      .fade-out {
        position: absolute;
        inset: 0;
        z-index: 5;
        background: #000;
        opacity: 0;
        pointer-events: none;
        animation: fadeout 0.6s ease 4.35s forwards;
        animation-play-state: paused;
      }

      .play .mark, .play .wordmark, .play .tagline, .play .subline, .play .foot, .play .fade-out {
        animation-play-state: running;
      }

      @keyframes reveal {
        to { opacity: 1; transform: scale(1); }
      }

      @keyframes rise {
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes fade {
        to { opacity: 1; }
      }

      @keyframes fadeout {
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="field"></div>

    <div class="content">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="17" fill="none" stroke="#f2a65a" stroke-width="1.4" />
        <circle cx="20" cy="20" r="11" fill="none" stroke="#24313d" stroke-width="1.2" />
        <path d="M20 8 L28 20 L20 32 L12 20 Z" fill="#5ec28a" opacity="0.9" />
        <circle cx="20" cy="20" r="2.2" fill="#0b1117" />
      </svg>

      <div class="wordmark">CONCOURSE</div>
      <div class="tagline">The menu is the <em>last guess.</em></div>
      <div class="subline">
        A per-stand concession mix optimizer for stadiums. Qloo ranks the partner.
        The model prices the switch. The agent chooses or declines.
      </div>
      <div class="foot">
        <span class="dot"></span>
        <span>Qloo Agentic Hackathon 2026</span>
      </div>
    </div>

    <div class="fade-out"></div>
  </body>
</html>
